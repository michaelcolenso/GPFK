version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harbinger
      POSTGRES_PASSWORD: harbinger
      POSTGRES_DB: harbinger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbinger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://harbinger:harbinger@db:5432/harbinger
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - model_cache:/app/.model_cache

  collector:
    build: .
    command: python -m src.collectors.daemon
    environment:
      DATABASE_URL: postgresql://harbinger:harbinger@db:5432/harbinger
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
  model_cache:
